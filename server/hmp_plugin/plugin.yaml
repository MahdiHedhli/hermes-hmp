# Hermes Mobile Protocol (HMP) v1 server plugin manifest.
# Closed surface (HMP v1 PR-2; FR-054): one platform adapter + one operator CLI, registered in
# __init__.register. No tools, hooks or capabilities are declared here, and none may be added
# without a contract change (tools/ci/check_plugin_surface.py enforces this).
name: hmp
label: Hermes Mobile (HMP)
kind: platform
version: 1.0.0-f1
description: >
  Hermes Mobile Protocol v1 platform adapter and operator CLI for Hermes Bot Mobile.
  Pairing and readiness are HMP-owned; Bot Chat reads, sends, jobs, and model controls
  require their own qualified Hermes build and authorization gates.
author: Hermes Bot Mobile
# A subdir install copies only this folder, not server/pyproject.toml. Hermes validates and warns
# about these declarations but does not install them automatically on the v2026.8.31 baseline.
# aiohttp is optional in that Hermes build; cryptography is core. The floors match its security
# pins. qrcode is the CLI's terminal QR renderer; its floor matches Hermes's optional extras.
python_dependencies:
  - "aiohttp>=3.14.3,<4"
  - "cryptography>=50"
  - "qrcode>=7.4.2,<9"
