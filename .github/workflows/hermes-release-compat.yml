name: Hermes release compatibility watch

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-release-compat-watch
  cancel-in-progress: false

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.11'
      - name: Inventory every published release since v0.21.0
        env:
          REPORT: ${{ runner.temp }}/release-report.json
          CANDIDATES: ${{ runner.temp }}/release-candidates.tsv
        run: |
          python3 tools/compat/watch_releases.py --inventory-only --report "$REPORT"
          python3 - <<'PY'
          import json, os
          report = json.load(open(os.environ['REPORT'], encoding='utf-8'))
          selected = [x for x in report['releases']
                      if x['tag'] == report['latest_tag'] or not x['reviewed_tag']]
          with open(os.environ['CANDIDATES'], 'w', encoding='utf-8') as out:
              for item in selected:
                  if item['status'] in ('invalid_tag', 'tag_not_fetched', 'retagged'):
                      raise SystemExit('Release tag is unavailable: ' + item['tag'])
                  out.write(f"release-{item['sha'][:12]}\t{item['sha']}\t{item['tag']}\n")
          PY
      - name: Run real HMP fixture and unsupported-build checks for new and latest releases
        env:
          BUILDS_DIR: /tmp/hermes-builds-${{ github.run_id }}
          MATRIX_OUT: /tmp/hmp-matrix-${{ github.run_id }}
          CANDIDATES: ${{ runner.temp }}/release-candidates.tsv
        run: |
          set -euo pipefail
          failed=0
          while IFS=$'\t' read -r label sha tag; do
            echo "Checking Hermes release $tag"
            mkdir -p "$BUILDS_DIR/$label" "$MATRIX_OUT/$label"
            git clone --quiet --depth=1 --branch "$tag" --single-branch \
              https://github.com/NousResearch/hermes-agent.git "$BUILDS_DIR/$label/src"
            test "$(git -C "$BUILDS_DIR/$label/src" rev-parse HEAD)" = "$sha"
            (
              cd "$BUILDS_DIR/$label/src"
              if ! uv sync --frozen --python 3.14; then
                uv sync --frozen --python 3.11
              fi
            )
            if ! uv run --frozen --project server --extra dev python tools/compat/run_matrix.py \
                --builds-dir "$BUILDS_DIR" --out "$MATRIX_OUT/$label" \
                --candidate-label "$label" --candidate-sha "$sha" \
                --json-out "$MATRIX_OUT/$label/result.json"; then
              failed=1
            fi
          done < "$CANDIDATES"
          exit "$failed"
      - name: Report release status
        if: always()
        env:
          REPORT: ${{ runner.temp }}/release-report.json
          MATRIX_DIR: /tmp/hmp-matrix-${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['REPORT'])
          matrices = Path(os.environ['MATRIX_DIR'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Hermes release compatibility watch\n\n')
              if report.exists():
                  data = json.loads(report.read_text())
                  out.write('| Release | Source state |\n| --- | --- |\n')
                  for item in data['releases']:
                      out.write(f"| {item['tag']} | {item['status']} |\n")
                  out.write('\nNew tags require human review before HMP claims support.\n')
              for matrix in sorted(matrices.glob('*/result.json')):
                  data = json.loads(matrix.read_text())
                  result = data['results'][0]
                  out.write(f"\n{result['label']} fixture matrix: {'passed' if result['qualified'] else 'failed'}; ")
                  out.write(f"unsupported-build check: {data['sc007_unsupported_path_check'] and data['sc007_unsupported_path_check']['ok']}.\n")
          PY
      - name: Flag new releases for review
        if: always()
        env:
          REPORT: ${{ runner.temp }}/release-report.json
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ['REPORT'], encoding='utf-8'))
          if data['unreviewed_tags']:
              raise SystemExit('New Hermes release(s) need compatibility review: ' + ', '.join(data['unreviewed_tags']))
          PY
